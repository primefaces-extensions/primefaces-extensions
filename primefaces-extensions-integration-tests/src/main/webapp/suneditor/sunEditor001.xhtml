<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:pe="primefaces.extensions">

    <f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
        <h:head>
            <link rel="icon" href="data:,"/>
        </h:head>

        <h:body>
            <h:form id="form">
                <p:messages id="msgs" showDetail="true" closable="true">
                    <p:autoUpdate/>
                </p:messages>

                <p>Basic</p>
                <pe:sunEditor id="basic" widgetVar="basicWidget" value="#{sunEditorController.value}"/>
                <h:outputText id="output" value="#{sunEditorController.value}" escape="false"/>

                <p>Ajax change</p>
                <pe:sunEditor id="ajax" widgetVar="ajaxWidget" value="#{sunEditorController.ajaxValue}">
                    <p:ajax event="change" listener="#{sunEditorController.onChange}" update="ajaxOutput changeCount"/>
                </pe:sunEditor>
                <h:outputText id="ajaxOutput" value="#{sunEditorController.ajaxValue}" escape="false"/>
                <h:outputText id="changeCount" value="#{sunEditorController.changeCount}"/>

                <p:commandButton id="submitButton" value="Submit" process="@form"
                                 actionListener="#{sunEditorController.submit}" update="output msgs"
                                 styleClass="mt-2 mr-2" icon="pi pi-save"/>
                <p:commandButton id="clearButton" type="button" value="Clear" styleClass="mt-2 mr-2"
                                 onclick="PF('basicWidget').clear();"/>
                <p:commandButton id="disableButton" type="button" value="Disable" styleClass="mt-2 mr-2"
                                 onclick="PF('basicWidget').disable();"/>
                <p:commandButton id="enableButton" type="button" value="Enable" styleClass="mt-2 mr-2"
                                 onclick="PF('basicWidget').enable();"/>
            </h:form>
        </h:body>
    </f:view>

</html>
