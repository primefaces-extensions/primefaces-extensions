<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:pe="primefaces.extensions">

    <f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
        <h:head/>

        <h:body>
            <h:form id="form">
                <p:messages id="msgs" showDetail="true" showSummary="true" autoUpdate="true"/>

                <h:panelGroup id="clockpickerGroup" layout="block">

                    <p>24 Hour with Focus Trigger and Time Selection</p>
                    <pe:clockpicker id="focus24h" widgetVar="focus24hWidget" autoClose="false"
                                    value="#{clockPickerController.time6}" showOn="focus" locale="en"/>

                </h:panelGroup>

                <p:commandButton id="submitButton" value="Submit" actionListener="#{clockPickerController.showTime6}"
                                 update="clockpickerGroup msgs" styleClass="mt-2 mr-2" icon="pi pi-save"/>
            </h:form>
        </h:body>
    </f:view>

</html>
