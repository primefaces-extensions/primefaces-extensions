<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">
<ui:composition>
    <p:menu id="useCaseList">
        <p:menuitem value="Basic Usage"
                    styleClass="#{navigationContext.getMenuitemStyleClass('basicUsage')}"
                    onclick="Showcase.selectUseCaseLink(this)" ajax="false" icon="pi pi-play"
                    url="#{request.contextPath}/sections/clockpicker/basicUsage.jsf"/>
        <p:menuitem value="12 Hour with Midnight Value"
                    styleClass="#{navigationContext.getMenuitemStyleClass('midnightUsage')}"
                    onclick="Showcase.selectUseCaseLink(this)" ajax="false" icon="pi pi-play"
                    url="#{request.contextPath}/sections/clockpicker/midnightUsage.jsf"/>
        <p:menuitem value="Placement"
                    styleClass="#{navigationContext.getMenuitemStyleClass('placementUsage')}"
                    onclick="Showcase.selectUseCaseLink(this)" ajax="false" icon="pi pi-play"
                    url="#{request.contextPath}/sections/clockpicker/placementUsage.jsf"/>
    </p:menu>
</ui:composition>
</html>
