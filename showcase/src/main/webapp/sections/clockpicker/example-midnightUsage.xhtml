<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces"
                xmlns:pe="primefaces.extensions">

    <p:growl id="midnightGrowl" showDetail="true" showSummary="true">
        <p:autoUpdate/>
    </p:growl>

    <!-- EXAMPLE-SOURCE-START -->
<h:panelGroup id="timePickerGroup" layout="block">

    <p>12 Hour with Midnight Value (12:00 AM)</p>
    <pe:clockpicker id="midnight" widgetVar="midnightWidget" autoClose="false"
                    value="#{clockPickerMidnightController.time}" twelveHour="true" showOn="button"/>

    <h:panelGroup id="messagePanel">
        <h:outputText value="#{clockPickerMidnightController.message}" styleClass="ui-message-info"
                      rendered="#{not empty clockPickerMidnightController.message}"/>
    </h:panelGroup>

</h:panelGroup>

<p:commandButton id="submitButton" value="Submit" action="#{clockPickerMidnightController.submit}"
                 update="timePickerGroup" styleClass="mt-2 mr-2" icon="pi pi-save"/>
    <!-- EXAMPLE-SOURCE-END -->
</ui:composition>
