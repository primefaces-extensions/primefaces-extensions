<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                xmlns:pe="http://primefaces.org/ui/extensions"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        FileDownload
    </ui:define>

    <ui:define name="description">
        FileDownload was retired from PrimeFaces Extensions and moved to PrimeFaces as <code>p:fileDownload</code>.
        It sends a file to the browser from an action of a command component.
    </ui:define>

    <ui:define name="implementation">
        <!-- EXAMPLE-SOURCE-START -->
        <div class="card">
            <!-- EXAMPLE: fileDownload/basic -->
            <h5>Basic</h5>
            <p>Add <code>p:fileDownload</code> with a <code>StreamedContent</code> value to a non-ajax command component.</p>
            <h:form id="formBasic">
                <p:commandButton value="Download" icon="pi pi-download" ajax="false">
                    <p:fileDownload value="#{fileDownloadController.file}"/>
                </p:commandButton>
            </h:form>
        </div>
        <!-- EXAMPLE-SOURCE-END -->
    </ui:define>

</ui:composition>
