<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces"
      xmlns:pe="primefaces.extensions">
<ui:composition template="/templates/masterLayout.xhtml">
    <ui:define name="resources-app">
        <ui:include src="/sections/shared/resources-app.xhtml"/>
        <h:outputStylesheet library="syntaxhighlighter" name="styles/school-book.css"/>
        <h:outputScript library="syntaxhighlighter" name="scripts/highlight.js" target="head"/>
        <h:outputScript library="syntaxhighlighter" name="scripts/highlightjs-badge.js" target="head"/>
        <h:outputScript id="syntaxhighlighterInit" target="body">
            Showcase.displayPage();
        </h:outputScript>
    </ui:define>
    <ui:define name="header">
        <ui:include src="/sections/system/header.xhtml"/>
    </ui:define>
    <ui:define name="center">
        <pe:layoutPane position="center" id="layoutCenter">
            <ui:insert name="centerContent"/>
        </pe:layoutPane>
        <pe:layoutPane position="west" id="layoutWest">
            <f:facet name="header">
                <h:outputText value="Components and more"/>
            </f:facet>
            <p:menu id="componentList">
                <p:menuitem value="Functions, Utils" styleClass="#{navigationContext.getMenuitemStyleClass('utils')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('utils')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/utils.jsf"/>
                <p:divider/>
                <p:menuitem value="Clipboard" styleClass="#{navigationContext.getMenuitemStyleClass('clipboard')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('clipboard')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/clipboard.jsf"/>
                <p:menuitem value="Document Viewer" styleClass="#{navigationContext.getMenuitemStyleClass('documentViewer')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('documentViewer')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/documentViewer.jsf"/>
                <p:menuitem value="ImageAreaSelect" styleClass="#{navigationContext.getMenuitemStyleClass('imageAreaSelect')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('imageAreaSelect')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/imageAreaSelect.jsf"/>
                <p:menuitem value="ImageRotateAndResize"
                            styleClass="#{navigationContext.getMenuitemStyleClass('imageRotateAndResize')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('imageRotateAndResize')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/imageRotateAndResize.jsf"/>
                <p:menuitem value="ImageZoom"
                            styleClass="#{navigationContext.getMenuitemStyleClass('imageZoom')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('imageZoom')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/imageZoom.jsf"/>
                <p:menuitem value="LightSwitch" styleClass="#{navigationContext.getMenuitemStyleClass('lightSwitch')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('lightSwitch')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/lightSwitch.jsf"/>
                <p:menuitem value="Localized" styleClass="#{navigationContext.getMenuitemStyleClass('localized')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('localized')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/localized.jsf"/>
                <p:menuitem value="RemoteCommand" styleClass="#{navigationContext.getMenuitemStyleClass('remoteCommand')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('remoteCommand')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/remoteCommand.jsf"/>
                <p:menuitem value="Speedtest" styleClass="#{navigationContext.getMenuitemStyleClass('speedtest')}"
                            icon="#{technicalInfo.getMenuitemIconStyleClass('speedtest')}"
                            onclick="Showcase.selectComponentLink(this)" ajax="false" url="#{request.contextPath}/views/speedtest.jsf"/>
            </p:menu>
            <pe:tooltip value="New component in the current release" shared="true" for="@(.p-new-comp)" styleClass="qtip-default"/>
            <pe:tooltip value="Updated component / use case in the current release" shared="true" for="@(.p-updated-comp)" styleClass="qtip-default"/>
            <pe:tooltip value="Deprecated component - Retired or moved to PrimeFaces" shared="true" for="@(.p-deprecated-comp)"
                        styleClass="qtip-default"/>
        </pe:layoutPane>
        <pe:layoutPane position="east" id="layoutEast">
            <pe:layoutPane position="center" styleContent="">
                <f:facet name="header">
                    <h:outputText value="Use Cases"/>
                </f:facet>
                <ui:insert name="useCases"/>
            </pe:layoutPane>
            <pe:layoutPane position="south">
                <ui:insert name="docuTable"/>
            </pe:layoutPane>
        </pe:layoutPane>
    </ui:define>
    <ui:define name="footer">
        <ui:include src="/sections/system/footer.xhtml"/>
    </ui:define>
</ui:composition>
</html>
