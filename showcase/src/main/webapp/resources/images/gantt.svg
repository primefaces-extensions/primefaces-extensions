<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="ganttTitle ganttDesc">
<title id="ganttTitle">Frappe Gantt chart example</title>
<desc id="ganttDesc">Gantt timeline with task bars, dependency arrows, popup details and a today marker, in the style of Frappe Gantt upstream hero image.</desc>
<defs>
<filter id="barShadow" x="-20%" y="-40%" width="140%" height="180%">
<feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
</filter>
<filter id="popupShadow" x="-30%" y="-30%" width="160%" height="170%">
<feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
</filter>
<clipPath id="ganttClip"><rect x="1" y="1" width="598" height="298" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="298" rx="12" fill="#ffffff" stroke="#e2e4e7"/>
<g clip-path="url(#ganttClip)">
<rect x="1" y="1" width="598" height="62" fill="#ffffff"/>
<!-- Official Frappe Gantt logo mark: #044D76 rounded square + #DDFDCC G-link shape -->
<rect x="14" y="11" width="26" height="26" rx="7" fill="#044d76"/>
<g fill="none" stroke="#ddfdcc" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="round">
<path d="M19.5 19.5 H31 Q34.5 19.5 34.5 23 V27 Q34.5 30.5 31 30.5 H23 Q19.5 30.5 19.5 27 V25.5"/>
<path d="M27 15 V19.5"/>
<path d="M27 30.5 V34.5"/>
</g>
<text x="48" y="30" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171717">January</text>
<rect x="526" y="11" width="60" height="26" rx="13" fill="#f1f1f2"/>
<text x="556" y="28" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#1f1f1f" text-anchor="middle">Today</text>
<g font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#a8a8a8" text-anchor="middle">
<text x="52" y="56">01</text><text x="94" y="56">02</text><text x="136" y="56">03</text><text x="178" y="56">04</text>
<text x="220" y="56">05</text><text x="262" y="56">06</text><text x="304" y="56">07</text>
<text x="388" y="56">09</text><text x="430" y="56">10</text><text x="472" y="56">11</text><text x="514" y="56">12</text>
</g>
<rect x="332" y="41" width="30" height="24" rx="7" fill="#1f1f1f"/>
<text x="347" y="57" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">08</text>
<g stroke="#edf1f4">
<line x1="52" y1="66" x2="52" y2="299"/><line x1="94" y1="66" x2="94" y2="299"/><line x1="136" y1="66" x2="136" y2="299"/>
<line x1="178" y1="66" x2="178" y2="299"/><line x1="220" y1="66" x2="220" y2="299"/><line x1="262" y1="66" x2="262" y2="299"/>
<line x1="304" y1="66" x2="304" y2="299"/><line x1="346" y1="66" x2="346" y2="299"/><line x1="388" y1="66" x2="388" y2="299"/>
<line x1="430" y1="66" x2="430" y2="299"/><line x1="472" y1="66" x2="472" y2="299"/><line x1="514" y1="66" x2="514" y2="299"/>
<line x1="556" y1="66" x2="556" y2="299"/>
<line x1="1" y1="112" x2="599" y2="112"/><line x1="1" y1="152" x2="599" y2="152"/><line x1="1" y1="192" x2="599" y2="192"/>
<line x1="1" y1="232" x2="599" y2="232"/><line x1="1" y1="270" x2="599" y2="270"/>
</g>
<!-- Task bars: white with #EBEBEB progress, subtle shadow, like upstream hero-image.png -->
<g font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" fill="#1a1a1a">
<g filter="url(#barShadow)">
<rect x="14" y="78" width="108" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
</g>
<text x="68" y="93" text-anchor="middle">Initial brainstorming</text>
<g filter="url(#barShadow)">
<rect x="150" y="118" width="150" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="150" y="118" width="60" height="24" rx="6" fill="#ebebeb" stroke="none"/>
</g>
<text x="225" y="133" text-anchor="middle">Develop wireframe</text>
<g filter="url(#barShadow)">
<rect x="234" y="158" width="150" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="234" y="158" width="52" height="24" rx="6" fill="#ebebeb" stroke="none"/>
</g>
<text x="309" y="173" text-anchor="middle">Client meeting</text>
<g filter="url(#barShadow)">
<rect x="318" y="198" width="180" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="318" y="198" width="86" height="24" rx="6" fill="#ebebeb" stroke="none"/>
</g>
<text x="408" y="213" text-anchor="middle">Create prototype</text>
<g filter="url(#barShadow)">
<rect x="402" y="238" width="150" height="24" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
</g>
<text x="477" y="253" text-anchor="middle">Test design with user</text>
</g>
<!-- Dependency arrows in upstream gold #D9B66C -->
<g stroke="#d9b66c" stroke-width="1.5" fill="none">
<path d="M68 102v12a4 4 0 0 0 4 4h74"/><path d="M260 142v10a4 4 0 0 0 4 4h6"/>
<path d="M286 182v10a4 4 0 0 0 4 4h6"/><path d="M361 222v10a4 4 0 0 0 4 4h33"/>
</g>
<g fill="#d9b66c">
<path d="M146 114l8 4-8 4z"/><path d="M270 152l8 4-8 4z"/><path d="M296 192l8 4-8 4z"/><path d="M398 232l8 4-8 4z"/>
</g>
<circle cx="347" cy="68" r="3.5" fill="#1f1f1f"/>
<line x1="347" y1="71" x2="347" y2="299" stroke="#1f1f1f" stroke-width="1.3"/>
<!-- Popup card like upstream hero: Create prototype details -->
<g filter="url(#popupShadow)">
<rect x="414" y="152" width="162" height="56" rx="8" fill="#ffffff" stroke="#ececec"/>
</g>
<g font-family="Inter, Arial, Helvetica, sans-serif">
<text x="426" y="172" font-size="12" font-weight="700" fill="#111111">Create prototype</text>
<text x="426" y="187" font-size="10" fill="#8a8a8a">Jan 09 - Jan 16 (8 days)</text>
<text x="426" y="200" font-size="10" fill="#8a8a8a">Progress: 30%</text>
</g>
</g>
</svg>
